name: Public browser source smoke
on:
  pull_request:
    paths:
      - server/scrapers/runtime.py
      - server/scrapers/models.py
      - server/public_jobs/browser.py
      - .github/workflows/public-source-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Read reviewed catalog without production state
        run: |
          pin="$(python -c "import json; print(json.load(open('catalog-lock.json'))['catalog_commit'])")"
          git init .catalog
          git -C .catalog remote add origin https://github.com/CrudMaster92/buboole-presets.git
          git -C .catalog fetch origin "$pin"
          git -C .catalog checkout --detach FETCH_HEAD
      - name: Inspect public response shape without credentials
        run: python scripts/public_browser_smoke.py
      - name: Collect isolated public browser sample
        run: |
          python -m server.public_jobs build --catalog .catalog --lock catalog-lock.json --state .smoke/state.json --output smoke-site --monitor super-c --monitor super-c-lachute --monitor ardene --monitor cascades --monitor fbl --monitor groupe-be-well-okeanos --monitor luxor-collection --minutes 3
          python -c "import json; m=json.load(open('smoke-site/api/v1/manifest.json')); print(json.dumps({'generation':m['generation'],'total_jobs':m['total_jobs'],'sources':[s for s in m['sources'] if s['id'] in ('super-c','super-c-lachute','ardene','cascades','fbl','groupe-be-well-okeanos','luxor-collection')]}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-browser-smoke
          path: smoke-site/api/v1/manifest.json
          retention-days: 3
          if-no-files-found: ignore
