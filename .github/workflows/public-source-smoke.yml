{
  "name": "Diagnose complete public boards",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "probe": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "run": "python -m pip install -r requirements-dev.txt"
        },
        {
          "run": "git init .catalog\ngit -C .catalog remote add origin https://github.com/CrudMaster92/buboole-presets.git\ngit -C .catalog fetch origin 60835af5d693e7ec6c83937f67f47b96f02aeb73\ngit -C .catalog checkout --detach FETCH_HEAD"
        },
        {
          "run": "PYTHONPATH=. python -u scripts/check_additional_sources.py"
        }
      ]
    }
  }
}
